# Стратегии для TLS (порт 443): имя|опции tpws
# Порядок важен: при равной скорости автоподбор предпочитает стратегию выше по списку.
# На macOS работает только tpws, поэтому здесь нет фейков (--dpi-desync=fake) из Windows-версии.

general|--tlsrec=midsld --split-pos=1 --disorder
general (ALT)|--tlsrec=sniext+1 --split-pos=midsld --disorder
general (ALT2)|--split-pos=midsld --disorder
general (ALT3)|--tlsrec=sniext --split-pos=1,midsld --disorder
general (ALT4)|--tlsrec=sniext --split-pos=1,sniext+1,host+1,midsld,endhost-1 --disorder
general (ALT5)|--split-pos=1,midsld --disorder
general (ALT6)|--split-pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1 --disorder
general (ALT7)|--oob --tlsrec=sniext --split-pos=1,midsld
general (ALT8)|--oob --split-pos=1,midsld
general (ALT9)|--oob --split-pos=midsld
general (ALT10)|--tlsrec=sniext --split-pos=1,midsld --disorder --hostcase --domcase
general (ALT11)|--split-pos=1 --disorder
general (ALT12)|--split-pos=2,sniext+1 --disorder
general (ALT13)|--split-pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1
general (ALT14)|--tlsrec=sniext
