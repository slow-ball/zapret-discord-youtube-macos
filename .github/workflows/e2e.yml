name: e2e

# Весь путь пользователя на настоящем macOS — на всех поддерживаемых версиях, Apple Silicon и Intel:
# установка, стратегии Windows-версии и свои, автоподбор, режимы сайтов, игровой фильтр,
# «сайт не открывается», глубокий подбор, прокси для Telegram, обновление, восстановление после
# обновления macOS, диагностика, приложение, удаление без следов. И переезд с 2.x на tpws.
# DPI на раннере нет, поэтому обход тут не проверить — только то, что всё ставится, запускается,
# не ломает интернет и убирается. На раннерах GitHub sudo работает без пароля.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      Z: /Users/runner/zapret-macos/src/zapret.sh
    steps:
      - uses: actions/checkout@v4

      - name: the project in ~/zapret-macos
        run: |
          rsync -a --exclude .git ./ ~/zapret-macos/
          # zapret speaks the language of macOS; the checks below look for Russian text
          defaults write -g AppleLanguages -array ru en

      - name: install
        run: |
          sudo "$Z" install --no-app
          ! test -e /opt/zapret

      - name: running after install
        run: |
          "$Z" status --json | tee status.json
          python3 -c 'import json; s = json.load(open("status.json")); assert s["installed"] and s["running"] and s["autostart"], s'

      - name: a strategy of the Windows version
        run: |
          sudo "$Z" start "nfqws general (ALT13)"
          pgrep -x utunws
          sudo pfctl -a com.apple/zapret-macos -s rules | grep route-to
          curl -fsS -o /dev/null -m 20 https://www.google.com/

      - name: our own strategies, switched without a restart
        run: |
          sudo "$Z" start "macos"
          pid=$(pgrep -f /opt/zapret-macos/nfqws/run.sh)
          for s in "macos (ALT8)" "macos (ALT14)"; do
            sudo "$Z" start "$s"
            pgrep -x utunws
            # the same run.sh: only utunws read the new strategy
            test "$(pgrep -f /opt/zapret-macos/nfqws/run.sh)" = "$pid"
            sudo pfctl -a com.apple/zapret-macos -s rules | grep route-to
            curl -fsS -o /dev/null -m 20 https://www.google.com/
          done
          test "$(cat /opt/zapret-macos/current)" = "macos (ALT14)"

      - name: strategy search, the likely ones first
        run: |
          sudo "$Z" check --json | tee fast.json
          python3 - <<'EOF'
          import json
          ev = [json.loads(l) for l in open("fast.json") if l.startswith("{")]
          results = [e for e in ev if e["event"] == "result"]
          # it starts with the running strategy
          assert results[0]["name"] == "macos (ALT14)", results[0]
          assert ev[-1]["event"] == "finish" and ev[-1]["best"], ev[-1]
          print("проверено", len(results))
          EOF
          pgrep -x utunws

      - name: strategy search, every strategy for real
        run: |
          sudo "$Z" check --json --all | tee check.json
          python3 - <<'EOF'
          import json
          ev = [json.loads(l) for l in open("check.json") if l.startswith("{")]
          results = [e for e in ev if e["event"] == "result"]
          assert len(results) == 37, len(results)
          assert ev[-1]["event"] == "finish" and ev[-1]["best"], ev[-1]
          EOF
          pgrep -x utunws
          curl -fsS -o /dev/null -m 20 https://www.google.com/

      - name: scopes and the game filter
        run: |
          # three rounds: restarts of the engine must not race
          for round in 1 2 3; do
            for s in smart lists all; do sudo "$Z" scope "$s"; pgrep -x utunws; done
          done
          sudo "$Z" game all
          pgrep -x utunws
          sudo pfctl -a com.apple/zapret-macos -s rules | grep -F '1024:65535'
          sudo "$Z" game off
          curl -fsS -o /dev/null -m 20 https://www.google.com/

      - name: a site that doesn't open
        run: |
          sudo "$Z" site https://www.example.com/page --json | tee site.json
          python3 -c 'import json; s = json.load(open("site.json")); assert s["site"] == "example.com" and s["works"], s'
          grep -qx example.com ~/zapret-macos/lists/list-user.txt

      - name: root does not trust the project folder
        run: |
          # a program of the user swaps its list for a link to a root-only file; the sudoers rule asks no password
          L=~/zapret-macos/lists
          mv "$L/list-user.txt" "$L/list-user.bak"
          ln -s /etc/sudoers "$L/list-user.txt"
          sudo "$Z" start
          ! sudo grep -rq "ALL" /opt/zapret-macos/lists
          sudo "$Z" site example.org --json
          ! sudo grep -q example.org /etc/sudoers
          sudo visudo -c
          rm "$L/list-user.txt"
          mv "$L/list-user.bak" "$L/list-user.txt"
          sudo "$Z" start

      - name: deep search
        run: |
          # no DPI here: the site opens as it is, and the strategy must stay
          sudo "$Z" deep www.example.com --json | tee deep.json
          tail -1 deep.json | python3 -c 'import json, sys; e = json.loads(sys.stdin.read()); assert e["event"] == "finish" and e.get("reason") == "open", e'
          pgrep -x utunws
          curl -fsS -o /dev/null -m 20 https://www.google.com/

      - name: Telegram proxy
        run: |
          sudo "$Z" telegram on
          "$Z" telegram test
          sudo "$Z" telegram on | grep -q "уже работает"

      - name: update as root, like the daily autoupdate
        run: |
          # the root copy looks old: the update downloads this very commit and runs the new script from
          # that download, never from the project folder. users get only releases, tests get the commit
          echo 0.0.1 | sudo tee /opt/zapret-macos/VERSION
          sudo env ZAPRET_UPDATE_REF=${{ github.event.pull_request.head.sha || github.sha }} /opt/zapret-macos/zapret.sh update
          test "$(cat /opt/zapret-macos/VERSION)" = "$(cat ~/zapret-macos/src/VERSION)"
          test "$(cat /opt/zapret-macos/previous)" = 0.0.1
          test "$(cat /opt/zapret-macos/project)" = "$HOME/zapret-macos"
          pgrep -x utunws
          # only signed releases, 3.1 and later
          ! sudo "$Z" update --to 2.2.1
          ! sudo "$Z" update --to 3.0.0
          ! sudo "$Z" update --to "1; touch /tmp/x"
          ! test -e /tmp/x

      - name: repair after a macOS update
        run: |
          # what a system update may reset: the sudoers rule and the running engine
          sudo rm /etc/sudoers.d/zapret-macos
          sudo launchctl bootout system/com.zapret-macos.nfqws
          sleep 2
          ! pgrep -x utunws
          sudo "$Z" repair --json | tee repair.json
          python3 -c 'import json; r = json.load(open("repair.json")); assert len(r["fixed"]) >= 2, r'
          sudo visudo -c -f /etc/sudoers.d/zapret-macos
          pgrep -x utunws
          # a stopped zapret stays stopped
          sudo "$Z" stop
          sudo "$Z" repair
          ! pgrep -x utunws
          sudo "$Z" start

      - name: diagnostics
        run: |
          sudo "$Z" diag --tags | tee diag.txt
          grep -q "работает, стратегия" diag.txt

      - name: in English when macOS is in English
        run: |
          defaults write -g AppleLanguages -array en ru
          sudo "$Z" diag --tags | tee diag-en.txt
          grep -q "running, strategy" diag-en.txt
          ! grep -q "[А-Яа-я]" <(grep -v "^#" diag-en.txt | grep -v "@fix")
          "$Z" help | grep -q "find a strategy"
          defaults write -g AppleLanguages -array ru en

      - name: the app from the release
        run: |
          "$Z" app
          codesign -v --deep /Applications/zapret.app
          test -d /Applications/zapret.app/Contents/PlugIns/ZapretWidget.appex

      - name: stop and uninstall, nothing left
        run: |
          sudo "$Z" stop
          ! pgrep -x utunws
          sudo "$Z" uninstall --yes
          for p in /opt/zapret /opt/zapret-macos /etc/sudoers.d/zapret-macos; do ! test -e "$p" || { echo "left: $p"; exit 1; }; done
          ! ls /Library/LaunchDaemons | grep -i zapret
          ! sudo pfctl -a com.apple/zapret-macos -s rules 2>/dev/null | grep .
          ! pgrep -f tg_ws_proxy
          curl -fsS -o /dev/null -m 20 https://www.google.com/

      - name: logs
        if: failure()
        run: |
          sudo tail -40 /var/log/zapret-macos.log /var/log/zapret-macos-nfqws.log /var/log/zapret-macos-telegram.log 2>/dev/null || true
          sudo pfctl -s rules 2>/dev/null | head -20 || true
          cat /opt/zapret-macos/nfqws.conf 2>/dev/null | head -40 || true

  # someone on 2.2.1 with a tpws strategy and autostart: the update moves them to the one engine
  upgrade:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      Z: /Users/runner/zapret-macos/src/zapret.sh
    steps:
      - uses: actions/checkout@v4

      - name: 2.2.1 with tpws
        run: |
          mkdir -p ~/zapret-macos
          curl -fsSL https://github.com/${{ github.repository }}/archive/refs/tags/v2.2.1.tar.gz | tar xz --strip-components=1 -C ~/zapret-macos
          sudo "$Z" install --no-app
          sudo "$Z" start "general (ALT6)"
          pgrep -f -- '--pidfile=/var/run/tpws1.pid'
          test -L /Library/LaunchDaemons/zapret.plist

      - name: the update runs the new script, as 2.x does
        run: |
          rsync -a --exclude .git ./ ~/zapret-macos/
          # finish_update of 2.x: the new script starts the running strategy by name
          sudo env ZAPRET_PROJECT="$HOME/zapret-macos" "$Z" start "general (ALT6)"

      - name: one engine, nothing of the old one left
        run: |
          pgrep -x utunws
          ! pgrep -f -- '--pidfile=/var/run/tpws1.pid'
          ! test -e /opt/zapret
          ! test -e /Library/LaunchDaemons/zapret.plist
          test "$(cat /opt/zapret-macos/current)" = "nfqws general"
          "$Z" status --json | tee status.json
          python3 -c 'import json; s = json.load(open("status.json")); assert s["running"] and s["autostart"], s'
          curl -fsS -o /dev/null -m 20 https://www.google.com/
          sudo "$Z" uninstall --yes
          ! ls /Library/LaunchDaemons | grep -i zapret

      - name: logs
        if: failure()
        run: sudo tail -40 /var/log/zapret-macos.log /var/log/zapret-macos-nfqws.log 2>/dev/null || true
