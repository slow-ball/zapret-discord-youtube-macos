name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          brew install shellcheck
          shellcheck -s bash src/zapret.sh src/menubar.sh src/90-block-quic zapret.command src/nfqws/run.sh build/utunws.sh build/check-nfqws.sh
      - name: strategies are valid tpws options
        run: |
          curl -fsSL -o z.tar.gz "https://github.com/bol-van/zapret/releases/download/v72.13/zapret-v72.13.tar.gz"
          echo "25c74e6c5f48963fa244c2955e76694a07c39447245a0457e2efdc74b3317e68  z.tar.gz" | shasum -a 256 -c
          tar xzf z.tar.gz
          tpws=zapret-v72.13/binaries/mac64/tpws
          grep -vE '^\s*(#|$)' src/strategies.conf | while IFS='|' read -r name opts; do
            # shellcheck disable=SC2086
            "$tpws" --port=1 --dry-run $opts >/dev/null || { echo "::error::invalid strategy: $name"; exit 1; }
          done
      - name: strategies are valid nfqws options
        run: |
          build/utunws.sh dist
          mkdir u && tar -xzf dist/utunws.tar.gz -C u
          build/check-nfqws.sh u/bin/utunws
      - name: app builds
        run: build/app.sh dist
      - name: launchers are executable
        run: |
          for f in zapret.command src/zapret.sh src/menubar.sh src/nfqws/run.sh build/utunws.sh build/check-nfqws.sh build/import-windows.py; do test -x "$f" || { echo "::error::$f is not executable"; exit 1; }; done
