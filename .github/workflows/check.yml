name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          brew install shellcheck
          shellcheck -s bash -x src/zapret.sh src/menubar.sh zapret.command src/nfqws/run.sh build/utunws.sh build/check-nfqws.sh build/release.sh tests/unit.sh
      - name: unit tests
        run: |
          tests/unit.sh
          python3 -m unittest discover -s tests
      - name: strategies and deep search options are valid for nfqws
        run: |
          build/utunws.sh dist
          mkdir u && tar -xzf dist/utunws.tar.gz -C u
          build/check-nfqws.sh u/bin/utunws
      - name: app builds
        run: build/app.sh dist
      - name: launchers are executable
        run: |
          for f in zapret.command src/zapret.sh src/menubar.sh src/nfqws/run.sh build/utunws.sh build/check-nfqws.sh build/release.sh build/import-windows.py tests/unit.sh; do test -x "$f" || { echo "::error::$f is not executable"; exit 1; }; done
